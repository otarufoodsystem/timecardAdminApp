<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勤務表・管理システム</title>
  <style>
    /* 元のベーススタイル */
    body { font-family: sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
    
    /* 🔒 元のログインモーダル（Overlay）デザイン */
    #login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); display: flex; justify-content: center; align-items: center;
      z-index: 10000;
    }
    .login-box {
      background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 100%; max-width: 360px; text-align: center;
    }
    .login-box h2 { margin-top: 0; color: #333; margin-bottom: 20px; }
    .login-box .form-group { text-align: left; margin-bottom: 15px; }
    .login-box label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
    .login-box input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .login-btn { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; font-weight: bold; margin-top: 10px; }
    .login-btn:hover { background: #0056b3; }
    #login-error { color: #dc3545; margin-top: 12px; font-size: 0.85rem; display: none; font-weight: bold; }

    /* メインアプリケーション領域 */
    #main-app { display: none; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .header-title { font-size: 1.2rem; font-weight: bold; }

    /* タブ & レイアウト */
    .tabs { display: flex; gap: 5px; margin-bottom: 15px; border-bottom: 2px solid #ccc; flex-wrap: wrap; }
    .tab-btn { padding: 10px 15px; cursor: pointer; border: none; background: #e0e0e0; font-weight: bold; border-radius: 5px 5px 0 0; }
    .tab-btn.active { background: #007bff; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .container { background: white; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .view-grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
    @media (max-width: 768px) { .view-grid { grid-template-columns: 1fr; } }
    .form-box { background: #fafafa; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 0.9rem; }
    .form-group input, .form-group select { width: 100%; padding: 8px; box-sizing: border-box; }
    .btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px; }
    .btn { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-primary { background: #007bff; color: white; }
    .btn-warning { background: #ffc107; color: #212529; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-edit { background: #28a745; color: white; }
    .btn-clear { background: #6c757d; color: white; }
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f2f2f2; }
    .badge { padding: 3px 8px; border-radius: 12px; color: white; font-size: 0.8rem; display: inline-block; }
    #loading { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.7); justify-content:center; align-items:center; z-index:99999; font-weight:bold; }
  </style>
</head>
<body>

  <!-- ローディング表示 -->
  <div id="loading">処理中...</div>

  <!-- 🔑 ログインモーダル (初期表示) -->
  <div id="login-overlay">
    <div class="login-box">
      <h2>🔑 管理画面ログイン</h2>
      <div class="form-group">
        <label for="login-username">ユーザー名</label>
        <input type="text" id="login-username" placeholder="ユーザー名を入力">
      </div>
      <div class="form-group">
        <label for="login-password">パスワード</label>
        <input type="password" id="login-password" placeholder="パスワードを入力">
      </div>
      <button class="login-btn" onclick="handleLogin()">ログイン</button>
      <div id="login-error">認証に失敗しました。</div>
    </div>
  </div>

  <!-- 📱 メイン画面 (ログイン成功後に展開) -->
  <div id="main-app">
    <div class="header-bar">
      <div class="header-title">⚙️ 勤怠管理システム</div>
      <button class="btn btn-clear" onclick="logout()">🚪 ログアウト</button>
    </div>

    <div class="tabs">
      <button id="tab-report-btn" class="tab-btn active" onclick="switchTab('report')">📊 勤務表照会</button>
      <button id="tab-staff-btn" class="tab-btn" onclick="switchTab('staff')">👤 スタッフ一覧メンテ</button>
      <button id="tab-store-btn" class="tab-btn" onclick="switchTab('store')">🏪 店舗一覧メンテ</button>
      <button id="tab-comment-btn" class="tab-btn" onclick="switchTab('comment')">💬 コメント一覧メンテ</button>
      <button id="tab-paidleave-btn" class="tab-btn" onclick="switchTab('paidleave')">🌴 有給申請管理</button>
    </div>

    <div class="container">
      <!-- 📊 勤務表照会 -->
      <div id="tab-report" class="tab-content active">
        <div style="display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap; align-items:center;">
          <select id="report-month"></select>
          <select id="report-store"></select>
          <select id="report-name"></select>
          <button class="btn btn-primary" onclick="searchWorkReport()">🔍 検索</button>
          <button class="btn btn-edit" onclick="saveReportEdits()">💾 変更分を保存</button>
          <button id="btn-csv-download" class="btn btn-warning" onclick="downloadReportCsv()">📥 CSV出力</button>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>氏名</th><th>日付</th><th>店舗</th><th>出勤</th><th>退勤</th>
                <th>休始</th><th>休終</th><th>IN1</th><th>OUT1</th><th>休憩</th>
                <th>勤務</th><th>残業</th><th>総時間</th><th>食事</th><th>コメント</th>
              </tr>
            </thead>
            <tbody id="report-table-body">
              <tr><td colspan="15" style="text-align:center;">検索条件を指定して検索してください。</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 👤 スタッフメンテ -->
      <div id="tab-staff" class="tab-content">
        <div class="view-grid">
          <div class="form-box">
            <h3 id="staff-form-title">スタッフ登録・編集</h3>
            <input type="hidden" id="staff-row-index">
            <div class="form-group"><label>氏名</label><input type="text" id="staff-name"></div>
            <div class="form-group"><label>所属店舗(カンマ区切り)</label><input type="text" id="staff-stores"></div>
            <div class="form-group"><label>定時時間</label><input type="text" id="staff-hours" value="08:00"></div>
            <div class="form-group"><label>在籍開始</label><input type="date" id="staff-date-from"></div>
            <div class="form-group"><label>在籍終了</label><input type="date" id="staff-date-to"></div>
            <div class="form-group"><label>INまるめ(分)</label><input type="number" id="staff-in-marume" value="15"></div>
            <div class="form-group"><label>OUTまるめ(分)</label><input type="number" id="staff-out-marume" value="1"></div>
            <div class="btn-row">
              <button class="btn btn-clear" onclick="clearStaffForm()">クリア</button>
              <button class="btn btn-primary" onclick="submitStaffForm()">保存</button>
            </div>
          </div>
          <div class="table-container">
            <table>
              <thead><tr><th>氏名</th><th>店舗</th><th>定時</th><th>開始</th><th>終了</th><th>まるめ</th><th>操作</th></tr></thead>
              <tbody id="staff-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 🏪 店舗メンテ -->
      <div id="tab-store" class="tab-content">
        <div class="view-grid">
          <div class="form-box">
            <h3 id="store-form-title">店舗登録・編集</h3>
            <input type="hidden" id="store-row-index">
            <div class="form-group"><label>店舗名</label><input type="text" id="store-name"></div>
            <div class="form-group"><label>緯度</label><input type="text" id="store-lat"></div>
            <div class="form-group"><label>経度</label><input type="text" id="store-lng"></div>
            <div class="form-group"><label>許容半径(m)</label><input type="number" id="store-radius" value="100"></div>
            <div class="btn-row">
              <button class="btn btn-clear" onclick="clearStoreForm()">クリア</button>
              <button class="btn btn-primary" onclick="submitStoreForm()">保存</button>
            </div>
          </div>
          <div class="table-container">
            <table>
              <thead><tr><th>店舗名</th><th>座標</th><th>半径</th><th>操作</th></tr></thead>
              <tbody id="store-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 💬 コメントメンテ -->
      <div id="tab-comment" class="tab-content">
        <div class="view-grid">
          <div class="form-box">
            <h3 id="comment-form-title">コメント登録・編集</h3>
            <input type="hidden" id="comment-row-index">
            <div class="form-group"><label>対象</label><input type="text" id="comment-target"></div>
            <div class="form-group"><label>コメント</label><textarea id="comment-text" rows="3" style="width:100%;"></textarea></div>
            <div class="form-group"><label>表示開始</label><input type="datetime-local" id="comment-from"></div>
            <div class="form-group"><label>表示終了</label><input type="datetime-local" id="comment-to"></div>
            <div class="form-group"><label>重要度</label><select id="comment-importance"><option value="普通">普通</option><option value="重要">重要</option></select></div>
            <div class="btn-row">
              <button class="btn btn-clear" onclick="clearCommentForm()">クリア</button>
              <button class="btn btn-primary" onclick="submitCommentForm()">保存</button>
            </div>
          </div>
          <div class="table-container">
            <div style="text-align:right; margin-bottom:5px;"><button class="btn btn-primary" onclick="refreshCommentList(this)">🔄 更新</button></div>
            <table>
              <thead><tr><th>ID</th><th>対象</th><th>重要度</th><th>内容</th><th>期間</th><th>操作</th></tr></thead>
              <tbody id="comment-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 🌴 有給申請管理 -->
      <div id="tab-paidleave" class="tab-content">
        <div class="view-grid">
          <div class="form-box">
            <h3 id="paidleave-form-title">有給申請 登録・編集</h3>
            <input type="hidden" id="paidleave-row-index" value="">
            <div class="form-group">
              <label for="paidleave-store">店舗名</label>
              <select id="paidleave-store"></select>
            </div>
            <div class="form-group">
              <label for="paidleave-name">氏名</label>
              <select id="paidleave-name"></select>
            </div>
            <div class="form-group">
              <label for="paidleave-date">取得日付 <span style="color:red">*</span></label>
              <input type="date" id="paidleave-date">
            </div>
            <div class="form-group">
              <label for="paidleave-time-from">開始時間 <small style="color:#777;">(任意)</small></label>
              <input type="time" id="paidleave-time-from">
            </div>
            <div class="form-group">
              <label for="paidleave-time-to">終了時間 <small style="color:#777;">(任意)</small></label>
              <input type="time" id="paidleave-time-to">
            </div>
            <div class="btn-row">
              <button class="btn btn-clear" onclick="clearPaidLeaveForm()">クリア</button>
              <button class="btn btn-primary" onclick="submitPaidLeaveForm()">保存する</button>
            </div>
          </div>

          <div class="table-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px;">
              <div style="display: flex; align-items: center; gap: 10px;">
                <h3 style="margin:0;">🌴 有給申請一覧</h3>
                <span id="paidleave-count-badge" class="badge" style="background-color: #17a2b8;">取得日数: 0日 (0時間)</span>
              </div>
              <div style="display: flex; gap: 8px; align-items: center;">
                <select id="paidleave-filter-month" onchange="loadPaidLeaveList()"></select>
                <button type="button" class="btn btn-primary" onclick="loadPaidLeaveList()">🔄 更新</button>
              </div>
            </div>
            <table>
              <thead>
                <tr><th>店舗</th><th>氏名</th><th>日付</th><th>From</th><th>To</th><th>区分</th><th>操作</th></tr>
              </thead>
              <tbody id="paidleave-table-body">
                <tr><td colspan="7" style="text-align:center;">データを読み込み中...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw1XlQUr-G7wq2jfpffq8v9g43V5tD4baDVxnnaU77n1SXnFvON5OhPqzHmmNlS1Oxq/exec"; // 👈 ご利用のGAS Web APP URLを記述してください
    const APP_VERSION = "1.7.0";
    const TEN_MINUTES = 10 * 60 * 1000;
    
    let currentUsername = "";
    let currentPassword = "";
    let timeoutTimer = null;

    window.onload = function() {
      // Enterキー押下でログイン実行
      const passInput = document.getElementById("login-password");
      if (passInput) {
        passInput.addEventListener("keypress", function(e) {
          if (e.key === "Enter") handleLogin();
        });
      }
      runAuthentication();
    };

    // 初期化 & 自動ログインチェック
    async function runAuthentication() {
      const savedUser = localStorage.getItem("admin_saved_username") || "";
      const savedPass = localStorage.getItem("admin_saved_password") || "";

      if (savedUser && savedPass) {
        showLoading(true);
        const success = await checkAuthAndLogin(savedUser, savedPass);
        showLoading(false);
        if (success) return;
      }
      // ログイン情報がない、または失敗した場合はモーダル表示
      document.getElementById("login-overlay").style.display = "flex";
      document.getElementById("main-app").style.display = "none";
    }

    // 手動ログイン処理
    async function handleLogin() {
      const uInput = document.getElementById("login-username").value.trim();
      const pInput = document.getElementById("login-password").value.trim();
      const errDiv = document.getElementById("login-error");

      errDiv.style.display = "none";
      if (!uInput || !pInput) {
        errDiv.innerText = "ユーザー名とパスワードを入力してください";
        errDiv.style.display = "block";
        return;
      }

      showLoading(true);
      const success = await checkAuthAndLogin(uInput, pInput);
      showLoading(false);

      if (!success) {
        errDiv.innerText = "ユーザー名またはパスワードが間違っています";
        errDiv.style.display = "block";
      }
    }

    // 認証 API 実行 & 初期データ読み込み
    async function checkAuthAndLogin(user, pass) {
      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "checkAuth", username: user, password: pass, appVersion: APP_VERSION })
        });
        const resData = await response.json();

        if (resData.success) {
          currentUsername = user;
          currentPassword = pass;
          localStorage.setItem("admin_saved_username", user);
          localStorage.setItem("admin_saved_password", pass);

          // 画面の切り替え
          document.getElementById("login-overlay").style.display = "none";
          document.getElementById("main-app").style.display = "block";

          // 各データの読み込み処理
          await loadStoreList();
          await loadStaffList();
          await loadCommentList();
          initPaidLeaveForm();
          initReportForm();
          resetTimeoutTimer();
          return true;
        }
      } catch (e) {
        console.error("認証処理通信エラー:", e);
      }
      return false;
    }

    function logout() {
      clearAuthStorage();
      location.reload();
    }

    function resetTimeoutTimer() {
      if (timeoutTimer) clearTimeout(timeoutTimer);
      if (currentUsername && currentPassword) {
        timeoutTimer = setTimeout(triggerTimeout, TEN_MINUTES);
      }
    }

    function triggerTimeout() {
      alert("10分間操作がなかったため自動ログアウトしました。");
      logout();
    }

    function clearAuthStorage() {
      localStorage.removeItem("admin_saved_username");
      localStorage.removeItem("admin_saved_password");
    }

    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'flex' : 'none';
    }

    function switchTab(type) {
      resetTimeoutTimer();
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById(`tab-${type}-btn`).classList.add('active');
      document.getElementById(`tab-${type}`).classList.add('active');

      if (type === 'paidleave' && typeof loadPaidLeaveList === 'function') {
        loadPaidLeaveList();
      }
    }

    async function callGas(action, data = null) {
      resetTimeoutTimer();
      const payload = { action: action, username: currentUsername, password: currentPassword };

      if (data !== null) {
        if (action.startsWith("delete")) { payload.rowIndex = data; }
        else { payload.data = data; if (data.rowIndex) payload.rowIndex = data.rowIndex; }
      }

      const response = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify(payload) });
      const resData = await response.json();
      if (!resData.success) throw new Error(resData.error || "APIエラー");
      return resData;
    }

    // --- 🌴 有給申請機能 ---
    function initPaidLeaveForm() {
      const monthSelect = document.getElementById("paidleave-filter-month");
      if (monthSelect) {
        monthSelect.innerHTML = "";
        const now = new Date();
        for (let i = -4; i <= 1; i++) {
          const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const opt = document.createElement("option");
          opt.value = `${y}/${m}`;
          opt.innerText = `${y}年${m}月度`;
          monthSelect.appendChild(opt);
        }
        monthSelect.value = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}`;
      }
      rebuildPaidLeaveStoreSelect();
    }

    function rebuildPaidLeaveStoreSelect() {
      const storeSelect = document.getElementById("paidleave-store");
      if (!storeSelect) return;
      storeSelect.innerHTML = '<option value="">-- 店舗を選択 --</option>';
      globalStoreList.forEach(item => {
        if (item.storeName) {
          const opt = document.createElement("option");
          opt.value = item.storeName;
          opt.innerText = item.storeName;
          storeSelect.appendChild(opt);
        }
      });
      storeSelect.onchange = updatePaidLeaveNameSelect;
    }

    function updatePaidLeaveNameSelect() {
      const storeSelect = document.getElementById("paidleave-store");
      const nameSelect = document.getElementById("paidleave-name");
      if (!storeSelect || !nameSelect) return;

      const selectedStore = storeSelect.value;
      nameSelect.innerHTML = '<option value="">-- スタッフを選択 --</option>';
      if (!selectedStore) return;

      globalStaffList.forEach(staff => {
        const belongStores = staff.stores.split(',').map(s => s.trim());
        if (belongStores.includes(selectedStore)) {
          const opt = document.createElement("option");
          opt.value = staff.name;
          opt.innerText = staff.name;
          nameSelect.appendChild(opt);
        }
      });
    }

    async function loadPaidLeaveList() {
      const monthVal = document.getElementById("paidleave-filter-month").value;
      const storeVal = document.getElementById("paidleave-store") ? document.getElementById("paidleave-store").value : "";
      const nameVal = document.getElementById("paidleave-name") ? document.getElementById("paidleave-name").value : "";

      const tbody = document.getElementById("paidleave-table-body");
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">読み込み中...</td></tr>';

      try {
        const res = await callGas("getPaidLeaveList", { month: monthVal, store: storeVal, name: nameVal });
        const list = res.data || [];
        if (list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">データがありません。</td></tr>';
          updatePaidLeaveSummary(0, 0);
          return;
        }

        let totalDays = 0, totalHours = 0, html = "";
        list.forEach(item => {
          let typeStr = "全日 (1日)";
          if (item.timeFrom && item.timeTo) {
            const h = calculateHoursBetween(item.timeFrom, item.timeTo);
            typeStr = `時間給 (${h}時間)`;
            totalHours += h;
          } else {
            totalDays += 1;
          }

          html += `<tr>
            <td>${escapeHtml(item.store)}</td>
            <td>${escapeHtml(item.name)}</td>
            <td style="text-align:center;">${escapeHtml(item.date)}</td>
            <td style="text-align:center;">${escapeHtml(item.timeFrom || "-")}</td>
            <td style="text-align:center;">${escapeHtml(item.timeTo || "-")}</td>
            <td style="text-align:center;"><span class="badge" style="background-color:#28a745;">${typeStr}</span></td>
            <td style="text-align:center;">
              <button class="btn btn-edit" onclick="editPaidLeave(${item.rowIndex}, '${item.store}', '${item.name}', '${item.date}', '${item.timeFrom}', '${item.timeTo}')">編集</button>
              <button class="btn btn-danger" onclick="deletePaidLeave(${item.rowIndex})">削除</button>
            </td>
          </tr>`;
        });

        tbody.innerHTML = html;
        updatePaidLeaveSummary(totalDays, totalHours);
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">エラーが発生しました。</td></tr>';
      }
    }

    function updatePaidLeaveSummary(days, hours) {
      const badge = document.getElementById("paidleave-count-badge");
      if (badge) badge.innerText = `合計: 全日 ${days}日 / 時間給 ${hours}時間`;
    }

    function calculateHoursBetween(t1, t2) {
      const [h1, m1] = t1.split(":").map(Number);
      const [h2, m2] = t2.split(":").map(Number);
      const diffMinutes = (h2 * 60 + m2) - (h1 * 60 + m1);
      return diffMinutes > 0 ? Math.round((diffMinutes / 60) * 10) / 10 : 0;
    }

    function escapeHtml(str) {

    // --- 📊 勤務表照会機能 ---
    function initReportForm() {
      const monthSelect = document.getElementById("report-month");
      monthSelect.innerHTML = "";
      const now = new Date();
      for (let i = -4; i <= 1; i++) {
        const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
        const y = d.getFullYear();
        const m = d.getMonth() + 1;
        const mStr = m < 10 ? "0" + m : m;
        const prevD = new Date(y, d.getMonth() - 1, 1);
        const prevM = prevD.getMonth() + 1;
        const opt = document.createElement("option");
        opt.value = `${y}/${mStr}`;
        opt.innerText = `${y}年${m}月度 (${prevM}/16 ～ ${m}/15)`;
        monthSelect.appendChild(opt);
      }
      let currentMonthString = now.getFullYear() + "/" + ((now.getMonth() + 1) < 10 ? "0" + (now.getMonth() + 1) : (now.getMonth() + 1));
      monthSelect.value = currentMonthString;

      const storeSelect = document.getElementById("report-store");
      rebuildReportStoreSelect(storeSelect);
    }

    function rebuildReportStoreSelect(storeSelect) {
      if (!storeSelect) return;
      storeSelect.innerHTML = '';
      globalStoreList.forEach(item => {
        if (item.storeName) {
          const opt = document.createElement("option");
          opt.value = item.storeName;
          opt.innerText = item.storeName;
          storeSelect.appendChild(opt);
        }
      });
      storeSelect.onchange = updateReportNameSelect;
      updateReportNameSelect();
    }

    function updateReportNameSelect() {
      const storeSelect = document.getElementById("report-store");
      const nameSelect = document.getElementById("report-name");
      const selectedStore = storeSelect.value;
      nameSelect.innerHTML = '<option value="すべてのスタッフ">すべてのスタッフ (店舗全員)</option>';
      if (!selectedStore) return;

      globalStaffList.forEach(staff => {
        const belongStores = staff.stores.split(',').map(s => s.trim());
        if (belongStores.includes(selectedStore)) {
          const opt = document.createElement("option");
          opt.value = staff.name;
          opt.innerText = staff.name;
          nameSelect.appendChild(opt);
        }
      });
    }

    async function searchWorkReport() {
      const month = document.getElementById("report-month").value;
      const store = document.getElementById("report-store").value;
      const name = document.getElementById("report-name").value;
      const tbody = document.getElementById("report-table-body");

      tbody.innerHTML = `<tr><td colspan="15" style="text-align:center;">🔄 抽出中...</td></tr>`;
      showLoading(true);

      try {
        const res = await callGas("getWorkReport", { month, store, name });
        showLoading(false);

        if (!res.data || res.data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="15" style="text-align:center;">該当データがありません。</td></tr>`;
          return;
        }

        tbody.innerHTML = "";
        res.data.forEach((item, index) => {
          const tr = document.createElement("tr");
          const mealOptions = ["", "〇"].map(val => `<option value="${val}" ${item.meal === val ? 'selected' : ''}>${val || "-"}</option>`).join("");
          tr.innerHTML = `
            <td><strong>${item.name}</strong></td>
            <td>${item.date}</td>
            <td><small>${item.store}</small></td>
            <td><input type="text" class="edit-input" data-key="inTime" data-index="${index}" value="${item.inTime || ""}" style="width:60px;"></td>
            <td><input type="text" class="edit-input" data-key="outTime" data-index="${index}" value="${item.outTime || ""}" style="width:60px;"></td>
            <td><input type="text" class="edit-input" data-key="restIn" data-index="${index}" value="${item.restIn || ""}" style="width:60px;"></td>
            <td><input type="text" class="edit-input" data-key="restOut" data-index="${index}" value="${item.restOut || ""}" style="width:60px;"></td>
            <td>${item.in1 || "-"}</td><td>${item.out1 || "-"}</td>
            <td>${item.restTime || "-"}</td><td><strong>${item.workTime || "-"}</strong></td>
            <td>${item.overTime || "-"}</td><td>${item.totalTime || "-"}</td>
            <td><select class="edit-input" data-key="meal" data-index="${index}">${mealOptions}</select></td>
            <td><small>${item.comment || ""}</small></td>
          `;
          tr.dataset.raw = JSON.stringify(item);
          tbody.appendChild(tr);
        });
      } catch (e) {
        showLoading(false);
        tbody.innerHTML = `<tr><td colspan="15" style="text-align:center; color:red;">エラーが発生しました。</td></tr>`;
      }
    }

    async function saveReportEdits() {
      const tbody = document.getElementById("report-table-body");
      const rows = tbody.querySelectorAll("tr");
      const updateData = [];

      rows.forEach(tr => {
        if (!tr.dataset.raw) return;
        const rawItem = JSON.parse(tr.dataset.raw);
        const idx = tr.querySelector(".edit-input").dataset.index;

        const inTime = tr.querySelector(`[data-key="inTime"][data-index="${idx}"]`).value.trim();
        const outTime = tr.querySelector(`[data-key="outTime"][data-index="${idx}"]`).value.trim();
        const restIn = tr.querySelector(`[data-key="restIn"][data-index="${idx}"]`).value.trim();
        const restOut = tr.querySelector(`[data-key="restOut"][data-index="${idx}"]`).value.trim();
        const meal = tr.querySelector(`[data-key="meal"][data-index="${idx}"]`).value;

        if (inTime !== rawItem.inTime || outTime !== rawItem.outTime || restIn !== rawItem.restIn || restOut !== rawItem.restOut || meal !== rawItem.meal) {
          updateData.push({ store: rawItem.store, name: rawItem.name, date: rawItem.date, inTime, outTime, restIn, restOut, meal });
        }
      });

      if (updateData.length === 0) { alert("変更されたデータはありません。"); return; }
      if (!confirm(`${updateData.length} 件の変更を保存しますか？`)) return;

      showLoading(true);
      try {
        const res = await callGas("updateWorkReport", updateData);
        showLoading(false);
        alert(res.message);
        searchWorkReport();
      } catch (e) {
        showLoading(false);
        alert("通信エラーが発生しました。");
      }
    }
